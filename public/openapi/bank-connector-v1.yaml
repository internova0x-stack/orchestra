openapi: 3.1.0
info:
  title: Orchestra Bank Connector API
  version: "1.0.0"
  summary: The contract a bank implements so Orchestra's AI support agent can read its records and request actions.
  description: |
    A bank (or its middleware) implements these endpoints once. Orchestra calls them over HTTPS to answer
    customers: it never stores the bank's records, only what each conversation needed, in its audit log.

    **Rules of the contract**
    - Every record belongs to an account holder (a business or a personal account). Orchestra always passes the
      verified customer's holder id and the bank returns only that holder's records.
    - Amounts are decimal strings in the currency's major unit ("4200.00"); currencies are ISO 4217 codes.
    - Times are ISO 8601 with a time zone.
    - A review hold comes back as a flag only (`review_hold: true`, or a restriction of type `review_hold`).
      The bank never sends Orchestra the reason, so the agent can't reveal it.
    - Full account numbers may be returned; Orchestra masks them to the last 4 digits before the AI sees them.
    - Actions carry an `Idempotency-Key` header. The same key twice must return the first result, never act twice.
    - A record that doesn't exist, or doesn't belong to the holder, is a 404. One exception: looking up a payment by
      id says `elsewhere: true` when the id is another holder's, with nothing else about it, so the agent can hand it
      to a person instead of saying it doesn't exist.
    - An action the bank won't take answers 200 with `accepted: false` and a `status` saying why.

    **Version 1 covers** every record the agent reads and every action it takes at the bank: the identity check,
    the customer and their contact details, payouts and the recall request, incoming payments, verification,
    balances, fees and currency conversions (and a goodwill fee refund), restrictions, cards (freeze, unfreeze, settings,
    replace) and
    card transactions, card, POS, ATM and web payments with their stage-by-stage timeline, loans, merchant payouts
    and holds, bill and airtime payments (refund), USSD and agent sessions, and unlocking online access.

    Orchestra keeps its own records of the cases it opens (disputes, reversal requests, deferral requests, fee
    waivers, recalls, handoffs) and its audit log; the bank only answers for its ledger.

    The reference implementation, backed by the prototype's simulated bank, is served at
    `/api/bank/v1` on the Orchestra prototype. All data there is invented.
servers:
  - url: https://bank.example/orchestra/v1
    description: Your implementation (example address)
  - url: /api/bank/v1
    description: The Orchestra prototype's reference implementation (simulated bank)
security:
  - bearer: []
tags:
  - name: Identity
  - name: Payouts
  - name: Incoming payments
  - name: Account
  - name: Cards
  - name: Payments
  - name: Lending
  - name: Merchants
  - name: Bills and USSD
  - name: Actions

paths:
  /identity/verify:
    post:
      tags: [Identity]
      summary: Check a customer's identity
      description: |
        The standard identity check: full name, date of birth, and a business's registration number (or a personal
        account's last 4 digits). Returns the user it identifies, or null. Never say which answer was wrong.
      operationId: verifyIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityCheck" }
            example: { full_name: "Ada Okafor", date_of_birth: "1988-03-14", registration_number: "11482037" }
      responses:
        "200":
          description: The user identified, or null
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id: { type: [string, "null"] }
              example: { user_id: "ada" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [Identity]
      summary: Find the customer by the phone or email on file
      description: "Listen mode: matches a helpdesk ticket or email to a customer. A match is not identity verification: Orchestra uses it only to look things up for the team, never to act or to tell the sender anything."
      operationId: findUserByContact
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}:
    get:
      tags: [Identity]
      summary: Get a verified user's profile
      operationId: getUser
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }

  /holders/{holderId}/transfers:
    get:
      tags: [Payouts]
      summary: Search the holder's payouts
      description: Newest first, at most 20. Filter by reference, recipient (part of the name) or exact amount.
      operationId: searchTransfers
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: reference, in: query, schema: { type: string }, example: "PO-88190" }
        - { name: recipient, in: query, schema: { type: string }, example: "Lumen" }
        - { name: amount, in: query, schema: { type: number }, example: 4200 }
      responses:
        "200":
          description: Matching payouts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /holders/{holderId}/incoming-payments:
    get:
      tags: [Incoming payments]
      summary: Search payments sent to the holder
      description: |
        The holder's credited payments, plus unallocated payments (arrived with a reference that matches no account,
        `holder_id: null`). Orchestra only shows an unallocated payment to a customer on an exact amount plus the payer
        or the date, and hands it to staff to credit.
      operationId: searchIncomingPayments
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: amount, in: query, schema: { type: number }, example: 2750 }
        - { name: currency, in: query, schema: { type: string }, example: "GBP" }
      responses:
        "200":
          description: Matching payments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/IncomingPayment" } }

  /holders/{holderId}/verification:
    get:
      tags: [Account]
      summary: The holder's verification (KYC) status
      operationId: getVerification
      parameters: [{ $ref: "#/components/parameters/holderId" }]
      responses:
        "200":
          description: Verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verification" }
        "404": { $ref: "#/components/responses/NotFound" }

  /holders/{holderId}/balances:
    get:
      tags: [Account]
      summary: The holder's balances, one per currency
      operationId: getBalances
      parameters: [{ $ref: "#/components/parameters/holderId" }]
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Balance" } }

  /holders/{holderId}/fees:
    get:
      tags: [Account]
      summary: Fees charged and currency conversions
      operationId: listFees
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: id, in: query, description: "One fee by id", schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [fee, conversion] } }
        - { name: transfer, in: query, description: "A payout reference", schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Fees and conversions, newest first, at most 40
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Fee" } }

  /holders/{holderId}/restrictions:
    get:
      tags: [Account]
      summary: Restrictions on the account or a payout
      description: A review hold has no reason in it, ever. A restriction the customer can fix carries the cause and the fix.
      operationId: listRestrictions
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: transfer, in: query, description: "Only restrictions on this payout (and the whole account)", schema: { type: string } }
      responses:
        "200":
          description: Restrictions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Restriction" } }

  /holders/{holderId}/recalls:
    post:
      tags: [Actions]
      summary: Request a recall of a payout
      description: |
        Ask the receiving bank to return a payout sent in error. Orchestra only calls this after its own checks: the
        customer's identity and role, the payout belongs to them, no review hold, the per-customer limit, the cap,
        and the customer's explicit yes. A recall above the cap is sent only after a supervisor approves it
        (`approved_by`). The `Idempotency-Key` is Orchestra's reference: the same key twice returns the first result.
      operationId: requestRecall
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string }, example: "REC-5501" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
            example: { transfer_id: "PO-88150", amount: "3200.00", currency: "USD", reference: "REC-5501", requested_by: "ada", approved_by: null }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallResult" }
              example: { accepted: true, bank_reference: "RCL-77810", status: "requested" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /users/{userId}/contact:
    get:
      tags: [Identity]
      summary: The phone, email and sign-in lock on file
      description: Orchestra sends one-time codes and reset links only to these, and masks them before the AI sees them.
      operationId: getContact
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Contact details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/unlock:
    post:
      tags: [Identity, Actions]
      summary: Unlock online access after failed sign-ins
      description: "Only a lock from failed sign-in attempts. A lock the bank placed is refused (`accepted: false`, `status: locked_by_bank`). Sent after the stronger identity check and the customer's yes."
      operationId: unlockLogin
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example: { reference: "UNL-EMEKA", requested_by: "Alexis" }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /holders/{holderId}/cards:
    get:
      tags: [Cards]
      summary: The holder's cards
      description: Newest first, replaced cards included (Orchestra skips them).
      operationId: listCards
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: last4, in: query, schema: { type: string }, example: "7710" }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Card" } }

  /holders/{holderId}/cards/{cardId}/freeze:
    post:
      tags: [Cards, Actions]
      summary: Freeze a card
      description: No new payments go through on it. Freezing a frozen card is accepted and changes nothing.
      operationId: freezeCard
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: cardId, in: path, required: true, schema: { type: string }, example: "CARD-7710" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example: { reference: "FRZ-7710", requested_by: "Alexis" }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /holders/{holderId}/cards/{cardId}/replace:
    post:
      tags: [Cards, Actions]
      summary: Order a replacement card
      description: "Stops the card and sends a new one to the delivery address on file (never one given in chat). `reason`: lost, stolen, damaged or expired."
      operationId: replaceCard
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: cardId, in: path, required: true, schema: { type: string }, example: "CARD-7710" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example: { reference: "CRD-7001", requested_by: "Alexis", reason: "lost" }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /holders/{holderId}/cards/{cardId}/unfreeze:
    post:
      tags: [Cards, Actions]
      summary: Unfreeze a card the customer froze
      description: "A freeze the bank placed is refused (accepted: false, status frozen_by_bank). Sent after Orchestra's checks: the institution's switch, the one-time code if it requires one, no open 'not mine' dispute on the card if it blocks those, and the customer's yes."
      operationId: unfreezeCard
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: cardId, in: path, required: true, schema: { type: string }, example: "CARD-4421" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example: { reference: "CHG-4401", requested_by: "Alexis" }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /holders/{holderId}/cards/{cardId}/settings:
    post:
      tags: [Cards, Actions]
      summary: Change a card's settings
      description: "Only the settings given change: online, international and contactless payments on or off, and the daily limit. Orchestra checks the institution's rules first (which changes need the one-time code, the highest limit it may set) and the customer's yes. Refused on a card the bank froze."
      operationId: updateCardSettings
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: cardId, in: path, required: true, schema: { type: string }, example: "CARD-3307" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ActionRequest" }
                - type: object
                  required: [settings]
                  properties:
                    settings: { $ref: "#/components/schemas/CardSettings" }
            example: { reference: "CHG-4402", requested_by: "Alexis", settings: { online_payments: true } }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /holders/{holderId}/card-transactions:
    get:
      tags: [Cards]
      summary: Search card transactions
      description: Newest first, at most 50.
      operationId: searchCardTransactions
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: id, in: query, schema: { type: string }, example: "TX-90021" }
        - { name: card, in: query, description: "A card id", schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, settled, declined, reversed] } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: merchant, in: query, description: "Part of the statement name or the merchant's name", schema: { type: string } }
        - { name: amount, in: query, schema: { type: number } }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CardTransaction" } }

  /holders/{holderId}/payments:
    get:
      tags: [Payments]
      summary: Search card, POS, ATM and web payments
      description: Newest first, at most 20. Includes payments that failed at the merchant or terminal while the account was debited.
      operationId: searchPayments
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: amount, in: query, schema: { type: number }, example: 18750 }
        - { name: channel, in: query, schema: { type: string, enum: [card, POS, ATM, web] } }
        - { name: card_last4, in: query, schema: { type: string } }
        - { name: merchant, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Payment" } }

  /holders/{holderId}/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: One payment by id
      description: |
        The payment if it's this holder's. If the id is another holder's, `payment` is null and `elsewhere` is true,
        and nothing else about it is returned.
      operationId: getPayment
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: paymentId, in: path, required: true, schema: { type: string }, example: "PAY-62003" }
      responses:
        "200":
          description: The payment, or where it isn't
          content:
            application/json:
              schema:
                type: object
                required: [payment, elsewhere]
                properties:
                  payment: { oneOf: [{ $ref: "#/components/schemas/Payment" }, { type: "null" }] }
                  elsewhere: { type: boolean }

  /holders/{holderId}/payments/{paymentId}/events:
    get:
      tags: [Payments]
      summary: A payment's timeline, stage by stage
      description: "Authorisation, capture, settlement and payout, each with its status, time and the party that reported it, in time order. Report what each party said, conflicts included: Orchestra spots them and doesn't guess."
      operationId: getPaymentEvents
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: paymentId, in: path, required: true, schema: { type: string }, example: "PAY-62004" }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PaymentEvent" } }

  /holders/{holderId}/loans:
    get:
      tags: [Lending]
      summary: The holder's loans
      description: Newest first.
      operationId: listLoans
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: id, in: query, schema: { type: string }, example: "LN-30021" }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Loan" } }

  /holders/{holderId}/merchant-payouts:
    get:
      tags: [Merchants]
      summary: A merchant's payouts
      description: "Newest first. A payout on a review hold has `review_hold: true` and no reason."
      operationId: listMerchantPayouts
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: id, in: query, schema: { type: string }, example: "PY-21007" }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MerchantPayout" } }

  /holders/{holderId}/merchant-holds:
    get:
      tags: [Merchants]
      summary: Holds on a merchant's funds
      description: A review hold has no reason in it, ever.
      operationId: listMerchantHolds
      parameters:
        - $ref: "#/components/parameters/holderId"
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MerchantHold" } }

  /holders/{holderId}/bill-payments:
    get:
      tags: [Bills and USSD]
      summary: Airtime, data and bill payments
      description: Newest first, at most 10, with the provider's delivery status.
      operationId: searchBillPayments
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: id, in: query, schema: { type: string }, example: "BP-30101" }
        - { name: amount, in: query, schema: { type: number } }
        - { name: kind, in: query, schema: { type: string, enum: [airtime, data, electricity, tv, water] } }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BillPayment" } }

  /holders/{holderId}/bill-payments/{billPaymentId}/refund:
    post:
      tags: [Bills and USSD, Actions]
      summary: Refund a bill payment that failed at the provider
      description: Only for `failed_at_provider`; anything else is refused. The bank stores Orchestra's `reference` as the refund reference. Sent after Orchestra's checks (stronger identity, the cap, the customer's yes).
      operationId: refundBillPayment
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: billPaymentId, in: path, required: true, schema: { type: string }, example: "BP-30101" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example: { reference: "BRF-2201", requested_by: "Alexis" }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

  /holders/{holderId}/ussd-sessions:
    get:
      tags: [Bills and USSD]
      summary: USSD sessions and agent-banking transactions
      description: Newest first, at most 5.
      operationId: searchUssdSessions
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: amount, in: query, schema: { type: number } }
        - { name: kind, in: query, schema: { type: string, enum: [ussd, agent] } }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/UssdSession" } }

  /holders/{holderId}/fees/{feeId}/refund:
    post:
      tags: [Account, Actions]
      summary: Refund a fee (goodwill waiver)
      description: Orchestra calls this only after checking the fee is waivable, under the cap and within the customer's yearly waiver, and the customer said yes.
      operationId: refundFee
      parameters:
        - $ref: "#/components/parameters/holderId"
        - { name: feeId, in: path, required: true, schema: { type: string }, example: "FEE-1001" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
            example: { reference: "WVR-3101", requested_by: "Alexis", reason: "goodwill waiver" }
      responses:
        "200":
          description: The bank's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { description: Missing Idempotency-Key or a malformed body }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key Orchestra sends on every call (BANK_API_KEY in Orchestra's settings).
  parameters:
    holderId:
      name: holderId
      in: path
      required: true
      description: The account holder (business or personal account) the verified customer belongs to.
      schema: { type: string }
      example: "brightline"
  responses:
    Unauthorized:
      description: Missing or wrong API key
    NotFound:
      description: No such record for this holder
  schemas:
    Money:
      type: string
      pattern: "^-?\\d+(\\.\\d+)?$"
      description: A decimal amount in the currency's major unit
      example: "4200.00"
    IdentityCheck:
      type: object
      required: [full_name, date_of_birth, registration_number]
      properties:
        full_name: { type: string }
        date_of_birth: { type: string, format: date }
        registration_number: { type: string, description: "A business's registration number, or a personal account's last 4 digits" }
    User:
      type: object
      required: [id, full_name, first_name, role, holder_id, holder_name, personal, country]
      properties:
        id: { type: string }
        full_name: { type: string }
        first_name: { type: string }
        role: { type: string, enum: [view_only, payment_rights] }
        holder_id: { type: string }
        holder_name: { type: string }
        personal: { type: boolean }
        country: { type: string, description: "Picks the market's rules: Nigeria, United Kingdom, United States", example: "United Kingdom" }
    Transfer:
      type: object
      required: [id, holder_id, recipient_name, recipient_account, amount, currency, route, status, sent_at, history, review_hold]
      properties:
        id: { type: string, example: "PO-88190" }
        holder_id: { type: string }
        recipient_name: { type: string }
        recipient_account: { type: string }
        recipient_bank: { type: [string, "null"] }
        recipient_country: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, example: "USD" }
        route: { type: string, example: "SWIFT" }
        description: { type: [string, "null"] }
        status: { type: string, enum: [pending, processing, successful, failed, reversed] }
        stage: { type: [string, "null"], example: "With an intermediary bank" }
        failure_reason: { type: [string, "null"] }
        sent_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        history:
          type: array
          items:
            type: object
            required: [stage, at]
            properties:
              stage: { type: string }
              at: { type: string, format: date-time }
        review_hold: { type: boolean, description: "True if the payout is on a review hold. No reason, ever." }
    IncomingPayment:
      type: object
      required: [id, holder_id, payer_name, amount, currency, status, received_at]
      properties:
        id: { type: string }
        holder_id: { type: [string, "null"], description: "Null while unallocated" }
        payer_name: { type: string }
        payer_bank: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        reference: { type: [string, "null"] }
        status: { type: string, enum: [credited, unallocated] }
        received_at: { type: string, format: date-time }
        credited_at: { type: [string, "null"], format: date-time }
    Verification:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [incomplete, pending, approved, failed, blocked] }
        reason: { type: [string, "null"], description: "Why it failed, in words for the customer. Never for blocked." }
        missing: { type: [string, "null"], description: "What is still needed" }
        submitted_at: { type: [string, "null"], format: date-time }
        kyc_tier: { type: [integer, "null"], description: "Where the country uses numbered tiers" }
    Balance:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
    Fee:
      type: object
      required: [id, kind, description, currency, amount, charged_at, waivable]
      properties:
        id: { type: string }
        kind: { type: string, enum: [fee, conversion] }
        description: { type: string }
        trigger: { type: [string, "null"] }
        transfer_id: { type: [string, "null"] }
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        from_currency: { type: [string, "null"] }
        from_amount: { type: [string, "null"] }
        to_currency: { type: [string, "null"] }
        to_amount: { type: [string, "null"] }
        rate: { type: [string, "null"] }
        charged_at: { type: string, format: date-time }
        waivable: { type: boolean }
    Restriction:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        transfer_id: { type: [string, "null"] }
        type: { type: string, enum: [review_hold, customer_can_fix] }
        customer_reason: { type: [string, "null"], description: "Only for customer_can_fix" }
    RecallRequest:
      type: object
      required: [transfer_id, amount, currency, reference, requested_by]
      properties:
        transfer_id: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        reference: { type: string, description: "Orchestra's reference for the request" }
        requested_by: { type: string, description: "The user id of the customer who asked" }
        approved_by: { type: [string, "null"], description: "The supervisor who approved a recall above the cap" }
    RecallResult:
      type: object
      required: [accepted, status]
      properties:
        accepted: { type: boolean }
        bank_reference: { type: [string, "null"] }
        status: { type: string, example: "requested" }
    ActionRequest:
      type: object
      required: [reference, requested_by]
      properties:
        reference: { type: string, description: "Orchestra's reference for the action" }
        requested_by: { type: string }
        reason: { type: [string, "null"] }
    ActionResult:
      type: object
      required: [accepted, status]
      properties:
        accepted: { type: boolean }
        bank_reference: { type: [string, "null"] }
        status: { type: string, description: "What happened, or why not (e.g. frozen, refunded, locked_by_bank, not_found)" }
    Contact:
      type: object
      required: [phone, email, login_locked]
      properties:
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        login_locked: { type: [string, "null"], description: "failed_logins, any other value for a lock the bank placed, or null" }
    Card:
      type: object
      required: [id, last4, status, currency, online_payments, international_payments, contactless, frozen_by, created_at]
      properties:
        id: { type: string }
        last4: { type: string }
        status: { type: string, enum: [active, frozen, replaced, expired] }
        currency: { type: string }
        daily_limit: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        delivery_address: { type: [string, "null"], description: "Orchestra shortens it before the AI sees it" }
        online_payments: { type: boolean }
        international_payments: { type: boolean }
        contactless: { type: boolean }
        frozen_by: { type: [string, "null"], enum: [customer, bank, null], description: "A freeze the bank placed is never lifted through Orchestra" }
        created_at: { type: string, format: date-time }
    CardTransaction:
      type: object
      required: [id, descriptor, channel, amount, currency, status, at]
      properties:
        id: { type: string }
        card_id: { type: [string, "null"] }
        card_last4: { type: [string, "null"] }
        descriptor: { type: string, description: "The name on the statement" }
        merchant_name: { type: [string, "null"] }
        location: { type: [string, "null"] }
        channel: { type: string, enum: [card, POS, ATM, web, transfer] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status: { type: string, enum: [pending, settled, declined, reversed] }
        decline_reason: { type: [string, "null"] }
        at: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, holder_id, channel, merchant_name, amount, currency, outcome, at]
      properties:
        id: { type: string }
        holder_id: { type: string }
        channel: { type: string, enum: [card, POS, ATM, web] }
        merchant_name: { type: string }
        location: { type: [string, "null"] }
        terminal_bank: { type: [string, "null"], description: "Another bank's ATM or terminal; null for your own" }
        processor: { type: [string, "null"] }
        card_last4: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        outcome: { type: string, enum: [successful, failed_debited, declined] }
        failure_detail: { type: [string, "null"] }
        at: { type: string, format: date-time }
    PaymentEvent:
      type: object
      required: [stage, status, reported_by, at]
      properties:
        stage: { type: string, enum: [authorization, capture, settlement, payout] }
        status: { type: string, enum: [ok, failed] }
        detail: { type: [string, "null"] }
        reported_by: { type: string }
        at: { type: string, format: date-time }
    Loan:
      type: object
      required: [id, product, currency, principal, balance, annual_rate, monthly_payment, next_due_at, arrears, status, started_at]
      properties:
        id: { type: string }
        product: { type: string }
        currency: { type: string }
        principal: { $ref: "#/components/schemas/Money" }
        balance: { $ref: "#/components/schemas/Money" }
        annual_rate: { type: string, description: "Percent a year", example: "6.900" }
        monthly_payment: { $ref: "#/components/schemas/Money" }
        next_due_at: { type: string, format: date-time }
        arrears: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [current, in_arrears, default] }
        started_at: { type: string, format: date-time }
    MerchantPayout:
      type: object
      required: [id, amount, currency, scheduled_for, status, sales, fees, refunds, disputes, review_hold]
      properties:
        id: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        scheduled_for: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, paid, delayed, rejected, on_hold] }
        delay_reason: { type: [string, "null"], description: "Never for a payout on a review hold" }
        sales: { $ref: "#/components/schemas/Money" }
        fees: { $ref: "#/components/schemas/Money" }
        refunds: { $ref: "#/components/schemas/Money" }
        disputes: { $ref: "#/components/schemas/Money" }
        paid_at: { type: [string, "null"], format: date-time }
        review_hold: { type: boolean }
    MerchantHold:
      type: object
      required: [id, amount, currency, type]
      properties:
        id: { type: string }
        payout_id: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        type: { type: string, enum: [review_hold, customer_can_fix] }
        customer_reason: { type: [string, "null"], description: "Only for customer_can_fix" }
    BillPayment:
      type: object
      required: [id, biller, kind, customer_ref, amount, currency, status, at]
      properties:
        id: { type: string }
        biller: { type: string }
        kind: { type: string, enum: [airtime, data, electricity, tv, water] }
        customer_ref: { type: string, description: "The phone, meter or account number paid for; Orchestra shortens it" }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status: { type: string, enum: [delivered, pending, failed_at_provider, refunded] }
        token: { type: [string, "null"] }
        provider_ref: { type: [string, "null"] }
        refund_reference: { type: [string, "null"] }
        at: { type: string, format: date-time }
    UssdSession:
      type: object
      required: [id, kind, action, amount, currency, outcome, at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ussd, agent] }
        code: { type: [string, "null"] }
        agent_name: { type: [string, "null"] }
        agent_id: { type: [string, "null"] }
        location: { type: [string, "null"] }
        action: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        outcome: { type: string }
        linked_ref: { type: [string, "null"] }
        at: { type: string, format: date-time }
    CardSettings:
      type: object
      description: Only the settings given change
      properties:
        online_payments: { type: boolean }
        international_payments: { type: boolean }
        contactless: { type: boolean }
        daily_limit: { $ref: "#/components/schemas/Money" }
